# 星芽 NewAPI（rc37 重建版）专用：push 或手动触发 → 构建镜像 → 推 ghcr.io/flowleaves/xingya-newapi-new
#
# 仓库为公开仓库时，推送进 GHCR 的镜像同样可匿名拉取；若面板上显示为私有，
# 在 Packages → 该包 → Package settings 里把可见性改为 Public 即可。
name: Build xingya-newapi-new image (GHCR)

on:
  push:
    branches:
      - main
      - codex/xingya-newapi-new
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: xingya-newapi-new-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image version
        id: version
        run: |
          SHA=$(git rev-parse --short HEAD)
          VERSION="v$(date +'%Y%m%d')-${SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/flowleaves/xingya-newapi-new:latest
            ghcr.io/flowleaves/xingya-newapi-new:${{ steps.version.outputs.version }}
          # 测试机为 amd64；若换成 arm64 主机，改成 linux/arm64 或两者都列
          platforms: linux/amd64
